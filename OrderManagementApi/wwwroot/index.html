<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>😻 CutiePatootie — Каталог</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">
      <span class="cat-emoji">😻</span> CutiePatootie
    </a>
    <div id="nav-auth" class="ms-auto d-flex align-items-center"></div>
  </div>
</nav>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">🐾 Каталог товаров</h1>
    <span id="count" class="badge bg-secondary"></span>
  </div>

  <div class="input-group mb-4">
    <input id="search" class="form-control" placeholder="Поиск по названию... 🔍">
    <button class="btn btn-primary" onclick="loadProducts()">Найти</button>
  </div>

  <div id="list" class="row g-4"></div>
</div>

<script src="app.js"></script>
<script>
updateNav();

document.getElementById("search").addEventListener("keyup", e => {
    if (e.key === "Enter") loadProducts();
});

async function loadProducts() {
    const search = document.getElementById("search").value;
    const res = await fetch(`/api/products?search=${encodeURIComponent(search)}`);
    const items = await res.json();

    const list = document.getElementById("list");
    const count = document.getElementById("count");
    count.textContent = items.length + " шт.";

    if (!items.length) {
        list.innerHTML = `<div class="col-12 text-center text-muted py-5">
            <div style="font-size:80px" class="cat-emoji">😿</div>
            <h4 class="mt-3">Товаров пока нет</h4>
            <p>Котики ждут, когда продавцы что-нибудь добавят 🐱</p>
        </div>`;
        return;
    }

    list.innerHTML = items.map(p => `
      <div class="col-md-4">
        <div class="card h-100 shadow-sm border-0">
          <img src="${p.imageUrl || 'https://placekitten.com/400/250'}"
               class="card-img-top" style="height:220px;object-fit:cover"
               onerror="this.src='https://placekitten.com/400/250'">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">${p.name}</h5>
            <p class="card-text text-muted small">${(p.description || '').slice(0,80)}</p>
            <p class="fw-bold fs-5 mt-auto mb-2 text-primary">${p.price} ₽</p>
            <p class="text-muted small mb-2">Продавец: ${p.sellerName || '—'}</p>
            <a href="product.html?id=${p.id}" class="btn btn-primary btn-sm">
              Подробнее <span class="cat-emoji">🐾</span>
            </a>
          </div>
        </div>
      </div>`).join("");
}
loadProducts();
</script>
</body>
</html>
